<nav class="navbar navbar-expand-sm navbar-light bg-light fixed-top mb-5 shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="{{ '/' | relative_url }}"><strong>{{ site.data.profile.navbar_name }}</strong></a>
        <button class="navbar-toggler" style="font-size: 1em; padding: 0.5em;" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
            <i class="fas fa-map"></i> Menu
        </button>

        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ml-auto">
                {% for item in site.data.navigation.pages %}
                <li class="nav-item {% if item.name == page.navbar_name %}active{% endif %}">
                    <a class="nav-link" href="{{ item.url | relative_url }}">{{ item.name }}{% if item.name == page.navbar_name %} <span class="sr-only">(current)</span>{% endif %}</a>
                </li>
                {% endfor %}
                <li class="nav-item d-flex align-items-center">
                    <button class="site-theme-toggle" id="site-theme-toggle" type="button" aria-label="Switch to dark mode" title="Toggle light/dark theme"></button>
                </li>
            </ul>
        </div>
    </div>
</nav>
