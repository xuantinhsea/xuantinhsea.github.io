short_bio: >-
  Hi, I am <strong>Nguyen Xuan Tinh</strong>, a Senior Hydrologist in the Water Resources &amp; Energy Department
  of <strong>Nippon Koei Co., Ltd.</strong> in Tokyo. I received my Ph.D. in Civil and Environmental Engineering
  from <a href="https://www.tohoku.ac.jp/en/" target="_blank" rel="noopener">Tohoku University</a>, after an
  M.Eng. in Water Resources Engineering at Lund University. Previously, I was a Senior Consultant at CTI Engineering
  International (2022–2026) and an Assistant Professor at Tohoku University (2017–2022).
  <br> With more than 18 years of experience, I lead flood-risk, coastal and climate-resilience projects across Asia
  and the Pacific for clients including <strong>ADB</strong>, <strong>JICA</strong> and the <strong>World Bank</strong>.
  <br> My research interests focus on <strong>coastal morphodynamics and shoreline evolution</strong>,
  <strong>flood and inundation modelling</strong>, and <strong>remote sensing and machine learning for water</strong>.
  <br> <span style="color: red; font-style: italic;">Feel free to contact me about consulting, technical advisory or research collaboration.</span>

