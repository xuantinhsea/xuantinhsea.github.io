short_bio: >-
  I am a <strong>Senior Hydrologist</strong> in the Water Resources &amp; Energy Department of
  <strong>Nippon Koei Co., Ltd.</strong> in Tokyo. For more than 18 years I have worked on floods, rivers and
  coasts, and today I lead flood-risk, river-basin and coastal-resilience assignments for the
  <strong>Asian Development Bank</strong>, <strong>JICA</strong>, the <strong>World Bank</strong> and national
  governments across Asia and the Pacific.
  <br> My work runs from the technical core &mdash; hydrological and hydraulic modelling, flood and inundation
  mapping, coastal morphodynamics and climate change impact assessment &mdash; to what makes a project land:
  feasibility studies, project management, and training the agencies that will run the systems once a project ends.
  <br> Before Nippon Koei, I was a Senior Consultant at CTI Engineering International (2022&ndash;2026), an
  Assistant Professor at Tohoku University (2017&ndash;2022) and a Water Resources Engineer at Dynamic
  International Solutions in Vietnam (2012&ndash;2015). Those years in research are why I bring remote sensing and
  machine learning into everyday project work.

