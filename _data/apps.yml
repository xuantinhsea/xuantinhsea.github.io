# Software and applications, grouped by "category" (in this order).
# "selected: true" also shows the app on the home page.
# Links: "live" for a running app, "code" for its repository.

- name: "Global Water Atlas"
  category: "Floods & Water Data"
  description: "One map of observed water data worldwide — river discharge and level, rainfall, reservoirs and tide gauges from 29 providers and about 98,000 stations — with selection tools, previews and batch CSV download. Built on the open-source RivRetrieve-Python library."
  tags: ["Python", "FastAPI", "React"]
  live: "https://global-water-atlas.vercel.app"
  code: "https://github.com/xuantinhsea/Global_Water_Atlas"
  cover: "assets/images/covers/app-global-water-atlas.jpg"
  selected: true

- name: "Magat Dam FloodCast"
  category: "Floods & Water Data"
  description: "Operator dashboard of an automated flood-forecasting system for the Magat River basin, Philippines: forecast rainfall drives the ICHARM RRI model to give discharge, water level, inundation depth and warning levels. Published as an archived snapshot."
  tags: ["RRI model", "Leaflet", "Chart.js"]
  live: "https://magat-dam-floodcast.vercel.app"
  code: "https://github.com/xuantinhsea/magat-dam-floodcast"
  cover: "assets/images/covers/app-magat-floodcast.jpg"
  selected: true

- name: "Thai Hydro Watch"
  category: "Floods & Water Data"
  description: "Water level, discharge and rainfall from Thailand’s ThaiWater network — 359 water-level stations and 2,003 rain gauges — with automatic data-quality checks, hydrographs and CSV export."
  tags: ["Python", "JavaScript"]
  live: "https://xuantinhsea.github.io/thai-hydro-watch/"
  code: "https://github.com/xuantinhsea/thai-hydro-watch"
  cover: "assets/images/covers/app-thai-hydro-watch.jpg"
  selected: true

- name: "StormFlood Mapping Pro"
  category: "Floods & Water Data"
  description: "Google Earth Engine dashboard for rapid storm-flood mapping from Sentinel-1 SAR, following the UN-SPIDER method, with optical cross-checks and estimates of exposed population, cropland and built-up area."
  tags: ["Google Earth Engine"]
  code: "https://github.com/xuantinhsea/StormFlood_Mapping_Pro"
  cover: "assets/images/covers/app-stormflood.jpg"
  selected: false

